{% extends "base.html" %}

{% block title %}审核中心 - 证书管理系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>审核中心</h2>
  <div>
    <button class="btn btn-info me-2" onclick="batchAiReview()">批量AI审核</button>
    <select class="form-select d-inline-block w-auto" id="filterStatus" onchange="loadReviews()">
      <option value="pending">待审核</option>
      <option value="">全部</option>
      <option value="approved">已通过</option>
      <option value="rejected">已拒绝</option>
    </select>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-striped table-hover" id="reviewTable">
        <thead>
          <tr>
            <th><input type="checkbox" class="form-check-input" id="selectAll" onclick="toggleSelectAll()"></th>
            <th>ID</th>
            <th>学生</th>
            <th>学号</th>
            <th>班级</th>
            <th>考试</th>
            <th>提交时间</th>
            <th>状态</th>
            <th>AI评分</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="reviewTableBody">
          <tr id="emptyRow">
            <td colspan="10" class="text-center text-muted">暂无数据</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Human Review Modal -->
<div class="modal fade" id="humanReviewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">人工审核</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="humanReviewForm">
          <input type="hidden" id="reviewRegId">
          <div class="mb-3">
            <label class="form-label">审核结果</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="reviewAction" id="actionApprove" value="approved" checked>
                <label class="form-check-label text-success" for="actionApprove">通过</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="reviewAction" id="actionReject" value="rejected">
                <label class="form-check-label text-danger" for="actionReject">拒绝</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="reviewAction" id="actionNeedMore" value="need_more_info">
                <label class="form-check-label text-warning" for="actionNeedMore">要求补充</label>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label for="reviewComment" class="form-label">审核意见</label>
            <textarea class="form-control" id="reviewComment" rows="3" placeholder="请输入审核意见..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" onclick="submitHumanReview()">提交</button>
      </div>
    </div>
  </div>
</div>

<!-- AI Review Result Modal -->
<div class="modal fade" id="aiResultModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">AI审核结果</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="aiResultBody">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let humanReviewModalInstance = null;
let aiResultModalInstance = null;
let reviewData = [];

document.addEventListener('DOMContentLoaded', async () => {
  const authed = await checkAuth();
  if (!authed) return;

  humanReviewModalInstance = new bootstrap.Modal(document.getElementById('humanReviewModal'));
  aiResultModalInstance = new bootstrap.Modal(document.getElementById('aiResultModal'));

  loadReviews();
});

async function loadReviews() {
  const status = document.getElementById('filterStatus').value;
  const url = status ? `/admin/reviews/data?status=${status}` : '/admin/reviews/data';
  try {
    const data = await apiRequest(url);
    reviewData = data || [];
    renderTable(reviewData);
  } catch (error) {
    showAlert(error.message || '加载审核列表失败', 'danger');
  }
}

function renderTable(data) {
  const tbody = document.getElementById('reviewTableBody');
  if (!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted">暂无数据</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(item => `
    <tr>
      <td><input type="checkbox" class="form-check-input row-checkbox" value="${item.id}"></td>
      <td>${item.id}</td>
      <td>${escapeHtml(item.student_name || '-')}</td>
      <td>${escapeHtml(item.student_no || '-')}</td>
      <td>${escapeHtml(item.class_name || '-')}</td>
      <td>${escapeHtml(item.exam_name || '-')}</td>
      <td>${formatDateTime(item.submit_time)}</td>
      <td>${getStatusBadge(item.review_status || item.status)}</td>
      <td>${item.ai_review_score != null ? item.ai_review_score : '-'}</td>
      <td>
        <button class="btn btn-sm btn-outline-info me-1" onclick="singleAiReview(${item.id})">AI审核</button>
        <button class="btn btn-sm btn-outline-primary" onclick="openHumanReviewModal(${item.id})">人工审核</button>
      </td>
    </tr>
  `).join('');
}

function toggleSelectAll() {
  const selectAll = document.getElementById('selectAll');
  const checkboxes = document.querySelectorAll('.row-checkbox');
  checkboxes.forEach(cb => cb.checked = selectAll.checked);
}

async function singleAiReview(id) {
  try {
    showAlert('AI审核已提交，请稍候...', 'info');
    const resp = await apiRequest(`/admin/reviews/${id}/ai`, { method: 'POST' });
    const taskId = resp.task_id;
    if (!taskId) {
      showAlert('AI审核返回异常', 'danger');
      return;
    }
    const result = await pollAiReviewStatus(taskId);
    if (result.status === 'completed') {
      showAlert('AI审核完成', 'success');
      const body = document.getElementById('aiResultBody');
      body.innerHTML = `
        <p><strong>结果:</strong> ${result.result?.result || '-'}</p>
        <p><strong>评分:</strong> ${result.result?.score != null ? result.result.score : '-'}</p>
        <p><strong>原因:</strong> ${escapeHtml(result.result?.reason || '-')}</p>
      `;
      aiResultModalInstance.show();
      loadReviews();
    } else {
      showAlert('AI审核失败: ' + (result.result?.msg || '未知错误'), 'danger');
    }
  } catch (error) {
    showAlert(error.message || 'AI审核失败', 'danger');
  }
}

async function batchAiReview() {
  const checked = document.querySelectorAll('.row-checkbox:checked');
  const ids = Array.from(checked).map(cb => parseInt(cb.value));
  if (ids.length === 0) {
    showAlert('请先选择要审核的记录', 'warning');
    return;
  }

  try {
    showAlert('批量AI审核已提交，请稍候...', 'info');
    const resp = await apiRequest('/admin/reviews/batch-ai', {
      method: 'POST',
      body: JSON.stringify({ ids })
    });
    const taskId = resp.task_id;
    if (!taskId) {
      showAlert('批量AI审核返回异常', 'danger');
      return;
    }
    const result = await pollAiReviewStatus(taskId);
    if (result.status === 'completed') {
      showAlert(`批量AI审核完成，共处理 ${result.result?.results?.length || 0} 条`, 'success');
      loadReviews();
    } else {
      showAlert('批量AI审核失败: ' + (result.result?.msg || '未知错误'), 'danger');
    }
  } catch (error) {
    showAlert(error.message || '批量AI审核失败', 'danger');
  }
}

async function pollAiReviewStatus(taskId, interval = 2000, maxAttempts = 60) {
  for (let i = 0; i < maxAttempts; i++) {
    await new Promise(resolve => setTimeout(resolve, interval));
    const status = await apiRequest(`/admin/reviews/ai-status/${taskId}`);
    if (status.status === 'completed' || status.status === 'failed') {
      return status;
    }
  }
  return { status: 'failed', result: { msg: '审核超时，请稍后刷新页面查看结果' } };
}

function openHumanReviewModal(id) {
  document.getElementById('reviewRegId').value = id;
  document.getElementById('humanReviewForm').reset();
  humanReviewModalInstance.show();
}

async function submitHumanReview() {
  const id = document.getElementById('reviewRegId').value;
  const action = document.querySelector('input[name="reviewAction"]:checked').value;
  const comment = document.getElementById('reviewComment').value.trim();

  try {
    await apiRequest(`/admin/reviews/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ action, comment })
    });
    showAlert('人工审核提交成功', 'success');
    humanReviewModalInstance.hide();
    loadReviews();
  } catch (error) {
    showAlert(error.message || '提交失败', 'danger');
  }
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatDateTime(dateStr) {
  if (!dateStr) return '-';
  return dateStr.substring(0, 10);
}


</script>
{% endblock %}
