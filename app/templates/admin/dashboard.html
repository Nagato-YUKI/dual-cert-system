{% extends "base.html" %}

{% block title %}管理仪表盘 - 证书管理系统{% endblock %}

{% block content %}
<div class="dashboard-header fade-in">
  <h1>管理仪表盘</h1>
  <p class="text-muted">欢迎回来，<span id="admin-name">管理员</span></p>
</div>

<!-- Stat Cards -->
<div class="row g-3 mb-4 fade-in">
  <div class="col-xl-3 col-md-6">
    <div class="stat-card">
      <div class="stat-value" id="stat-cert-types">0</div>
      <div class="stat-label">证书总数</div>
    </div>
  </div>
  <div class="col-xl-3 col-md-6">
    <div class="stat-card">
      <div class="stat-value" id="stat-exams">0</div>
      <div class="stat-label">考试场次</div>
    </div>
  </div>
  <div class="col-xl-3 col-md-6">
    <div class="stat-card">
      <div class="stat-value" id="stat-registrations">0</div>
      <div class="stat-label">报名人数</div>
    </div>
  </div>
  <div class="col-xl-3 col-md-6">
    <div class="stat-card">
      <div class="stat-value" id="stat-pass-rate">0%</div>
      <div class="stat-label">通过率</div>
    </div>
  </div>
</div>

<!-- Charts Row -->
<div class="row g-3 mb-4 fade-in">
  <div class="col-lg-8">
    <div class="card h-100">
      <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
        <h5 class="card-title mb-0 fw-semibold">报名趋势</h5>
      </div>
      <div class="card-body">
        <div id="registration-trend-chart" style="height: 280px;"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card h-100">
      <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
        <h5 class="card-title mb-0 fw-semibold">证书分类分布</h5>
      </div>
      <div class="card-body">
        <div id="cert-category-chart" style="height: 280px;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Recent Exams & Reviews -->
<div class="row g-3 fade-in">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0 fw-semibold">最近考试</h5>
        <a href="/admin/exams" class="btn btn-sm btn-outline-primary">查看全部</a>
      </div>
      <div class="card-body pt-2">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>考试名称</th>
                <th>日期</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="recent-exams-body">
              <tr><td colspan="3" class="text-center" style="color: var(--text-tertiary); padding: 24px;">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0 fw-semibold">待审核报名</h5>
        <a href="/admin/reviews" class="btn btn-sm btn-outline-primary">查看全部</a>
      </div>
      <div class="card-body pt-2">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>学生</th>
                <th>考试</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="pending-reviews-body">
              <tr><td colspan="3" class="text-center" style="color: var(--text-tertiary); padding: 24px;">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const authed = await checkAuth();
    if (!authed) return;

    const user = getUserInfo();
    if (user && user.name) {
      document.getElementById('admin-name').textContent = user.name;
    }

    await loadDashboardData();
  });

  async function loadDashboardData() {
    try {
      // Fetch cert types
      const certTypes = await apiRequest('/admin/cert-types');
      document.getElementById('stat-cert-types').textContent = certTypes.length || 0;

      // Fetch exams
      const exams = await apiRequest('/admin/exams/data');
      document.getElementById('stat-exams').textContent = exams.length || 0;

      // Fetch reviews (registrations) - use admin prefix
      const reviews = await apiRequest('/admin/reviews/data?status=pending');
      const allRegs = await apiRequest('/admin/reviews/data');
      document.getElementById('stat-registrations').textContent = (allRegs && allRegs.length) || 0;

      // Calculate pass rate from approved vs total
      const approvedCount = allRegs ? allRegs.filter(r => r.status === 'approved').length : 0;
      const passRate = allRegs && allRegs.length > 0 ? Math.round((approvedCount / allRegs.length) * 100) : 0;
      document.getElementById('stat-pass-rate').textContent = passRate + '%';

      // Render recent exams table
      renderRecentExams(exams ? exams.slice(0, 5) : []);

      // Render pending reviews table
      renderPendingReviews(reviews ? reviews.slice(0, 5) : []);

      // Render charts
      renderRegistrationTrendChart(allRegs || []);
      renderCertCategoryChart(certTypes || []);
    } catch (error) {
      console.error('Dashboard load error:', error);
      showAlert('加载仪表盘数据失败: ' + error.message, 'danger');
    }
  }

  function renderRecentExams(exams) {
    const tbody = document.getElementById('recent-exams-body');
    if (!exams || exams.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" class="text-center" style="color: var(--text-tertiary); padding: 24px;">暂无考试数据</td></tr>';
      return;
    }
    tbody.innerHTML = exams.map(exam => `
      <tr>
        <td>${escapeHtml(exam.exam_name || '-')}</td>
        <td>${formatDate(exam.exam_date)}</td>
        <td>${getStatusBadge(exam.status)}</td>
      </tr>
    `).join('');
  }

  function renderPendingReviews(reviews) {
    const tbody = document.getElementById('pending-reviews-body');
    if (!reviews || reviews.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" class="text-center" style="color: var(--text-tertiary); padding: 24px;">暂无待审核报名</td></tr>';
      return;
    }
    tbody.innerHTML = reviews.map(review => `
      <tr>
        <td>${escapeHtml(review.student_name || review.student_no || '-')}</td>
        <td>${escapeHtml(review.exam_name || '-')}</td>
        <td>${getStatusBadge(review.review_status || review.status)}</td>
      </tr>
    `).join('');
  }

  function renderRegistrationTrendChart(registrations) {
    const chartDom = document.getElementById('registration-trend-chart');
    if (!chartDom) return;
    const chart = echarts.init(chartDom);

    // Group by month
    const counts = {};
    registrations.forEach(reg => {
      const date = reg.submit_time ? reg.submit_time.substring(0, 7) : '未知';
      counts[date] = (counts[date] || 0) + 1;
    });

    const sortedKeys = Object.keys(counts).sort();
    const data = sortedKeys.map(k => counts[k]);

    const option = {
      tooltip: { trigger: 'axis' },
      xAxis: {
        type: 'category',
        data: sortedKeys,
        axisLabel: { rotate: 30, color: '#475569' },
        axisLine: { lineStyle: { color: '#E2E8F0' } }
      },
      yAxis: { type: 'value', minInterval: 1, axisLabel: { color: '#475569' }, splitLine: { lineStyle: { color: '#F1F5F9' } } },
      series: [{
        data: data,
        type: 'line',
        smooth: true,
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(26,86,219,0.3)' },
            { offset: 1, color: 'rgba(26,86,219,0.05)' }
          ])
        },
        itemStyle: { color: '#1A56DB' },
        lineStyle: { width: 3 }
      }],
      grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true }
    };

    chart.setOption(option);
    window.addEventListener('resize', () => chart.resize());
  }

  function renderCertCategoryChart(certTypes) {
    const chartDom = document.getElementById('cert-category-chart');
    if (!chartDom) return;
    const chart = echarts.init(chartDom);

    const counts = {};
    certTypes.forEach(ct => {
      const cat = ct.category || '未分类';
      counts[cat] = (counts[cat] || 0) + 1;
    });

    const data = Object.keys(counts).map(k => ({ value: counts[k], name: k }));

    const option = {
      tooltip: { trigger: 'item' },
      legend: { bottom: '0%', left: 'center', textStyle: { color: '#475569' } },
      series: [{
        type: 'pie',
        radius: ['40%', '70%'],
        avoidLabelOverlap: false,
        itemStyle: {
          borderRadius: 8,
          borderColor: '#fff',
          borderWidth: 2
        },
        label: { show: false },
        emphasis: {
          label: { show: true, fontSize: 14, fontWeight: 'bold' }
        },
        color: ['#1A56DB', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#06B6D4'],
        data: data
      }]
    };

    chart.setOption(option);
    window.addEventListener('resize', () => chart.resize());
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '-';
    return dateStr.substring(0, 10);
  }


</script>
{% endblock %}
