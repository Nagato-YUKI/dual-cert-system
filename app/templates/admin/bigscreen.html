<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据大屏 - 证书管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #0a0e27;
      color: #fff;
      font-family: 'Microsoft YaHei', sans-serif;
      overflow: hidden;
    }
    .bigscreen-header {
      text-align: center;
      padding: 20px 0;
      background: linear-gradient(90deg, transparent, rgba(0,123,255,0.2), transparent);
      border-bottom: 1px solid rgba(0,123,255,0.3);
    }
    .bigscreen-header h1 {
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 4px;
      margin: 0;
      text-shadow: 0 0 20px rgba(0,123,255,0.5);
    }
    .stat-card {
      background: rgba(0,123,255,0.1);
      border: 1px solid rgba(0,123,255,0.3);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-value {
      font-size: 3rem;
      font-weight: bold;
      color: #00d4ff;
      text-shadow: 0 0 10px rgba(0,212,255,0.5);
    }
    .stat-label {
      font-size: 1rem;
      color: #8b9dc3;
      margin-top: 8px;
    }
    .chart-container {
      background: rgba(0,123,255,0.05);
      border: 1px solid rgba(0,123,255,0.2);
      border-radius: 8px;
      padding: 15px;
      height: 100%;
    }
    .chart-box {
      height: 300px;
    }
    .fullscreen-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }
    .logout-btn {
      position: fixed;
      top: 20px;
      right: 90px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <button class="btn btn-outline-danger btn-sm logout-btn" onclick="logout()">
    退出登录
  </button>
  <button class="btn btn-outline-light btn-sm fullscreen-btn" onclick="toggleFullscreen()">
    全屏
  </button>

  <div class="bigscreen-header">
    <h1>学生校内双证管理数据大屏</h1>
    <p class="text-muted mt-2">实时数据监控中心</p>
  </div>

  <div class="container-fluid py-4">
    <!-- Stat Cards Row -->
    <div class="row g-4 mb-4">
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-value" id="total-certs">0</div>
          <div class="stat-label">证书类型总数</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-value" id="total-exams">0</div>
          <div class="stat-label">考试场次总数</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-value" id="total-students">0</div>
          <div class="stat-label">学生总数</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-value" id="total-registrations">0</div>
          <div class="stat-label">报名总人次</div>
        </div>
      </div>
    </div>

    <!-- Charts Row 1 -->
    <div class="row g-4 mb-4">
      <div class="col-lg-6">
        <div class="chart-container">
          <h5 class="text-center mb-3">报名状态分布</h5>
          <div id="regStatusChart" class="chart-box"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="chart-container">
          <h5 class="text-center mb-3">证书分类分布</h5>
          <div id="certCategoryChart" class="chart-box"></div>
        </div>
      </div>
    </div>

    <!-- Charts Row 2 -->
    <div class="row g-4 mb-4">
      <div class="col-lg-8">
        <div class="chart-container">
          <h5 class="text-center mb-3">近6个月报名趋势</h5>
          <div id="monthlyTrendChart" class="chart-box"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="chart-container">
          <h5 class="text-center mb-3">热门考试TOP5</h5>
          <div id="topExamsChart" class="chart-box"></div>
        </div>
      </div>
    </div>

    <!-- Charts Row 3 -->
    <div class="row g-4">
      <div class="col-12">
        <div class="chart-container">
          <h5 class="text-center mb-3">班级学生分布</h5>
          <div id="classDistributionChart" class="chart-box"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const authed = await checkAuth();
      if (!authed) return;
      await loadBigScreenData();
      // Auto refresh every 30 seconds
      setInterval(loadBigScreenData, 30000);
    });

    async function loadBigScreenData() {
      try {
        const data = await apiRequest('/admin/bigscreen/data');

        // Update stat cards
        document.getElementById('total-certs').textContent = data.total_certs || 0;
        document.getElementById('total-exams').textContent = data.total_exams || 0;
        document.getElementById('total-students').textContent = data.total_students || 0;
        document.getElementById('total-registrations').textContent = data.total_registrations || 0;

        // Render charts
        renderRegStatusChart(data.reg_status_distribution);
        renderCertCategoryChart(data.cert_category_distribution);
        renderMonthlyTrendChart(data.monthly_trend);
        renderTopExamsChart(data.top_exams);
        renderClassDistributionChart(data.class_distribution);
      } catch (error) {
        console.error('加载大屏数据失败:', error);
      }
    }

    function renderRegStatusChart(data) {
      const chart = echarts.init(document.getElementById('regStatusChart'));
      const option = {
        tooltip: { trigger: 'item' },
        series: [{
          type: 'pie',
          radius: ['40%', '70%'],
          data: data.map(item => ({ value: item.count, name: item.status })),
          label: { color: '#fff' },
          itemStyle: { borderRadius: 5, borderColor: '#0a0e27', borderWidth: 2 }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function renderCertCategoryChart(data) {
      const chart = echarts.init(document.getElementById('certCategoryChart'));
      const option = {
        tooltip: { trigger: 'item' },
        series: [{
          type: 'pie',
          radius: '70%',
          data: data.map(item => ({ value: item.count, name: item.category })),
          label: { color: '#fff' },
          itemStyle: { borderRadius: 5, borderColor: '#0a0e27', borderWidth: 2 }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function renderMonthlyTrendChart(data) {
      const chart = echarts.init(document.getElementById('monthlyTrendChart'));
      const option = {
        tooltip: { trigger: 'axis' },
        xAxis: {
          type: 'category',
          data: data.map(item => item.month),
          axisLabel: { color: '#8b9dc3' },
          axisLine: { lineStyle: { color: '#333' } }
        },
        yAxis: {
          type: 'value',
          axisLabel: { color: '#8b9dc3' },
          axisLine: { lineStyle: { color: '#333' } },
          splitLine: { lineStyle: { color: '#222' } }
        },
        series: [{
          data: data.map(item => item.count),
          type: 'bar',
          itemStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: '#00d4ff' },
              { offset: 1, color: '#007bff' }
            ]),
            borderRadius: [4, 4, 0, 0]
          }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function renderTopExamsChart(data) {
      const chart = echarts.init(document.getElementById('topExamsChart'));
      const option = {
        tooltip: { trigger: 'axis' },
        xAxis: {
          type: 'value',
          axisLabel: { color: '#8b9dc3' },
          axisLine: { lineStyle: { color: '#333' } },
          splitLine: { lineStyle: { color: '#222' } }
        },
        yAxis: {
          type: 'category',
          data: data.map(item => item.exam_name).reverse(),
          axisLabel: { color: '#8b9dc3', fontSize: 10 },
          axisLine: { lineStyle: { color: '#333' } }
        },
        series: [{
          data: data.map(item => item.count).reverse(),
          type: 'bar',
          itemStyle: {
            color: '#00d4ff',
            borderRadius: [0, 4, 4, 0]
          }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function renderClassDistributionChart(data) {
      const chart = echarts.init(document.getElementById('classDistributionChart'));
      const option = {
        tooltip: { trigger: 'axis' },
        xAxis: {
          type: 'category',
          data: data.names,
          axisLabel: { color: '#8b9dc3', rotate: 30 },
          axisLine: { lineStyle: { color: '#333' } }
        },
        yAxis: {
          type: 'value',
          axisLabel: { color: '#8b9dc3' },
          axisLine: { lineStyle: { color: '#333' } },
          splitLine: { lineStyle: { color: '#222' } }
        },
        series: [{
          data: data.counts,
          type: 'bar',
          itemStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: '#28a745' },
              { offset: 1, color: '#1e7e34' }
            ]),
            borderRadius: [4, 4, 0, 0]
          }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
