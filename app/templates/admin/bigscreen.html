<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据大屏 - 证书管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0a0e27;
      color: #fff;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    .bigscreen-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .bigscreen-header {
      text-align: center;
      padding: 1.2vh 0;
      background: linear-gradient(90deg, transparent, rgba(0,123,255,0.2), transparent);
      border-bottom: 1px solid rgba(0,123,255,0.3);
      flex-shrink: 0;
      position: relative;
    }
    .bigscreen-header h1 {
      font-size: clamp(1.2rem, 2.5vh, 2.5rem);
      font-weight: bold;
      letter-spacing: 4px;
      margin: 0;
      text-shadow: 0 0 20px rgba(0,123,255,0.5);
    }
    .bigscreen-header .subtitle {
      font-size: clamp(0.7rem, 1.2vh, 1rem);
      color: #8b9dc3;
      margin-top: 2px;
    }
    .fullscreen-btn {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      z-index: 1000;
    }
    .back-btn {
      position: absolute;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      z-index: 1000;
    }
    .bigscreen-body {
      flex: 1;
      padding: 1.2vh 1.5vw;
      display: flex;
      flex-direction: column;
      gap: 1.2vh;
      overflow: hidden;
      min-height: 0;
    }
    .stat-row {
      display: flex;
      gap: 1vw;
      flex-shrink: 0;
    }
    .stat-card {
      flex: 1;
      background: rgba(0,123,255,0.1);
      border: 1px solid rgba(0,123,255,0.3);
      border-radius: 8px;
      padding: 1.2vh 0;
      text-align: center;
    }
    .stat-value {
      font-size: clamp(1.5rem, 3.5vh, 3rem);
      font-weight: bold;
      color: #00d4ff;
      text-shadow: 0 0 10px rgba(0,212,255,0.5);
    }
    .stat-label {
      font-size: clamp(0.7rem, 1.2vh, 1rem);
      color: #8b9dc3;
      margin-top: 4px;
    }
    .charts-row {
      display: flex;
      gap: 1vw;
      flex: 1;
      min-height: 0;
    }
    .chart-container {
      background: rgba(0,123,255,0.05);
      border: 1px solid rgba(0,123,255,0.2);
      border-radius: 8px;
      padding: 1vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chart-container h5 {
      text-align: center;
      margin-bottom: 0.5vh;
      font-size: clamp(0.75rem, 1.3vh, 1rem);
      color: #8b9dc3;
      flex-shrink: 0;
    }
    .chart-box {
      flex: 1;
      min-height: 0;
    }
    .chart-col-6 { flex: 1; }
    .chart-col-8 { flex: 2; }
    .chart-col-4 { flex: 1; }
    .chart-col-12 { flex: 1; }
  </style>
</head>
<body>
  <div class="bigscreen-wrapper">
    <div class="bigscreen-header">
      <h1>学生校内双证管理数据大屏</h1>
      <p class="subtitle">实时数据监控中心</p>
      <button class="btn btn-outline-warning btn-sm back-btn" onclick="goBack()">
        退出大屏
      </button>
      <button class="btn btn-outline-light btn-sm fullscreen-btn" onclick="toggleFullscreen()">
        全屏
      </button>
    </div>

    <div class="bigscreen-body">
      <!-- Stat Cards Row -->
      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-value" id="total-certs">0</div>
          <div class="stat-label">证书类型总数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-exams">0</div>
          <div class="stat-label">考试场次总数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-students">0</div>
          <div class="stat-label">学生总数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-registrations">0</div>
          <div class="stat-label">报名总人次</div>
        </div>
      </div>

      <!-- Charts Row 1 -->
      <div class="charts-row">
        <div class="chart-container chart-col-6">
          <h5>报名状态分布</h5>
          <div id="regStatusChart" class="chart-box"></div>
        </div>
        <div class="chart-container chart-col-6">
          <h5>证书分类分布</h5>
          <div id="certCategoryChart" class="chart-box"></div>
        </div>
      </div>

      <!-- Charts Row 2 -->
      <div class="charts-row">
        <div class="chart-container chart-col-8">
          <h5>近6个月报名趋势</h5>
          <div id="monthlyTrendChart" class="chart-box"></div>
        </div>
        <div class="chart-container chart-col-4">
          <h5>热门考试TOP5</h5>
          <div id="topExamsChart" class="chart-box"></div>
        </div>
      </div>

      <!-- Charts Row 3 -->
      <div class="charts-row">
        <div class="chart-container chart-col-12">
          <h5>班级学生分布</h5>
          <div id="classDistributionChart" class="chart-box"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    // 状态中文映射
    const STATUS_ZH = {
      'approved': '已通过',
      'rejected': '已拒绝',
      'pending': '待审核',
      'ai_reviewed': 'AI已审',
      'need_more_info': '需补充',
      'upcoming': '即将开始',
      'ongoing': '进行中',
      'completed': '已结束',
      'cancelled': '已取消',
      'finished': '已结束',
      'active': '启用',
      'inactive': '停用',
      'passed': '已通过',
      'failed': '未通过',
      'expired': '已过期',
      'reviewed': '已审核',
      'revoked': '已撤销',
      'obtained': '已获取',
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const authed = await checkAuth();
      if (!authed) return;
      await loadBigScreenData();
      setInterval(loadBigScreenData, 30000);
    });

    async function loadBigScreenData() {
      try {
        const data = await apiRequest('/admin/bigscreen/data');

        document.getElementById('total-certs').textContent = data.total_certs || 0;
        document.getElementById('total-exams').textContent = data.total_exams || 0;
        document.getElementById('total-students').textContent = data.total_students || 0;
        document.getElementById('total-registrations').textContent = data.total_registrations || 0;

        renderRegStatusChart(data.reg_status_distribution);
        renderCertCategoryChart(data.cert_category_distribution);
        renderMonthlyTrendChart(data.monthly_trend);
        renderTopExamsChart(data.top_exams);
        renderClassDistributionChart(data.class_distribution);
      } catch (error) {
        console.error('加载大屏数据失败:', error);
      }
    }

    function renderRegStatusChart(data) {
      const chart = echarts.init(document.getElementById('regStatusChart'));
      const option = {
        tooltip: { trigger: 'item' },
        series: [{
          type: 'pie',
          radius: ['40%', '70%'],
          data: data.map(item => ({ value: item.count, name: STATUS_ZH[item.status] || item.status })),
          label: { color: '#fff', fontSize: 12 },
          itemStyle: { borderRadius: 5, borderColor: '#0a0e27', borderWidth: 2 }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function renderCertCategoryChart(data) {
      const chart = echarts.init(document.getElementById('certCategoryChart'));
      const option = {
        tooltip: { trigger: 'item' },
        series: [{
          type: 'pie',
          radius: '70%',
          data: data.map(item => ({ value: item.count, name: item.category })),
          label: { color: '#fff', fontSize: 12 },
          itemStyle: { borderRadius: 5, borderColor: '#0a0e27', borderWidth: 2 }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function renderMonthlyTrendChart(data) {
      const chart = echarts.init(document.getElementById('monthlyTrendChart'));
      const option = {
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '4%', bottom: '8%', top: '8%', containLabel: true },
        xAxis: {
          type: 'category',
          data: data.map(item => item.month),
          axisLabel: { color: '#8b9dc3', fontSize: 10 },
          axisLine: { lineStyle: { color: '#333' } }
        },
        yAxis: {
          type: 'value',
          axisLabel: { color: '#8b9dc3' },
          axisLine: { lineStyle: { color: '#333' } },
          splitLine: { lineStyle: { color: '#222' } }
        },
        series: [{
          data: data.map(item => item.count),
          type: 'bar',
          itemStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: '#00d4ff' },
              { offset: 1, color: '#007bff' }
            ]),
            borderRadius: [4, 4, 0, 0]
          }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function renderTopExamsChart(data) {
      const chart = echarts.init(document.getElementById('topExamsChart'));
      const option = {
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '8%', bottom: '3%', top: '3%', containLabel: true },
        xAxis: {
          type: 'value',
          axisLabel: { color: '#8b9dc3' },
          axisLine: { lineStyle: { color: '#333' } },
          splitLine: { lineStyle: { color: '#222' } }
        },
        yAxis: {
          type: 'category',
          data: data.map(item => item.exam_name).reverse(),
          axisLabel: { color: '#8b9dc3', fontSize: 10 },
          axisLine: { lineStyle: { color: '#333' } }
        },
        series: [{
          data: data.map(item => item.count).reverse(),
          type: 'bar',
          itemStyle: {
            color: '#00d4ff',
            borderRadius: [0, 4, 4, 0]
          }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function renderClassDistributionChart(data) {
      const chart = echarts.init(document.getElementById('classDistributionChart'));
      const option = {
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '4%', bottom: '8%', top: '8%', containLabel: true },
        xAxis: {
          type: 'category',
          data: data.names,
          axisLabel: { color: '#8b9dc3', rotate: 30, fontSize: 10 },
          axisLine: { lineStyle: { color: '#333' } }
        },
        yAxis: {
          type: 'value',
          axisLabel: { color: '#8b9dc3' },
          axisLine: { lineStyle: { color: '#333' } },
          splitLine: { lineStyle: { color: '#222' } }
        },
        series: [{
          data: data.counts,
          type: 'bar',
          itemStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: '#28a745' },
              { offset: 1, color: '#1e7e34' }
            ]),
            borderRadius: [4, 4, 0, 0]
          }
        }]
      };
      chart.setOption(option);
      window.addEventListener('resize', () => chart.resize());
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function goBack() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
      window.location.href = '/admin';
    }
  </script>
</body>
</html>
