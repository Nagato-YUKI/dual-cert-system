{% extends "base.html" %}

{% block title %}登录 - 证书管理系统{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="mb-3">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1A56DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/>
        </svg>
      </div>
      <h1 class="login-title">证书管理系统</h1>
      <p class="login-subtitle">校内双证管理平台</p>
    </div>

    <!-- Login Tabs -->
    <ul class="nav nav-pills nav-justified mb-4" id="loginTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-login" type="button" role="tab">
          管理员
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="student-tab" data-bs-toggle="tab" data-bs-target="#student-login" type="button" role="tab">
          学生
        </button>
      </li>
    </ul>

    <div class="tab-content" id="loginTabContent">
      <!-- Admin Login Form -->
      <div class="tab-pane fade show active" id="admin-login" role="tabpanel">
        <div id="admin-error" class="alert alert-danger d-none" role="alert"></div>
        <form id="admin-login-form">
          <div class="mb-3">
            <label for="admin-username" class="form-label fw-medium">用户名</label>
            <input type="text" class="form-control" id="admin-username" name="username" placeholder="请输入用户名" required>
          </div>
          <div class="mb-4">
            <label for="admin-password" class="form-label fw-medium">密码</label>
            <input type="password" class="form-control" id="admin-password" name="password" placeholder="请输入密码" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">登录</button>
          </div>
        </form>
      </div>

      <!-- Student Login Form -->
      <div class="tab-pane fade" id="student-login" role="tabpanel">
        <div id="student-error" class="alert alert-danger d-none" role="alert"></div>
        <form id="student-login-form">
          <div class="mb-3">
            <label for="student-no" class="form-label fw-medium">学号</label>
            <input type="text" class="form-control" id="student-no" name="student_no" placeholder="请输入学号" required>
          </div>
          <div class="mb-4">
            <label for="student-password" class="form-label fw-medium">身份证后6位</label>
            <input type="password" class="form-control" id="student-password" name="password" placeholder="请输入身份证后6位" required maxlength="6">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">登录</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function showLoginError(elementId, message) {
    const el = document.getElementById(elementId);
    el.textContent = message;
    el.classList.remove('d-none');
    setTimeout(() => { el.classList.add('d-none'); }, 5000);
  }

  function hideLoginError(elementId) {
    document.getElementById(elementId).classList.add('d-none');
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Admin login
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideLoginError('admin-error');
      const username = document.getElementById('admin-username').value.trim();
      const password = document.getElementById('admin-password').value;

      try {
        const result = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password }),
        });
        setToken(result.access_token);
        setUserInfo({
          id: result.id,
          role: result.role,
          username: result.username,
          name: result.name,
        });
        window.location.href = '/admin';
      } catch (error) {
        showLoginError('admin-error', error.message || '登录失败，请检查用户名和密码');
      }
    });

    // Student login
    document.getElementById('student-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideLoginError('student-error');
      const studentNo = document.getElementById('student-no').value.trim();
      const password = document.getElementById('student-password').value;

      try {
        const result = await apiRequest('/auth/student/login', {
          method: 'POST',
          body: JSON.stringify({ student_no: studentNo, password }),
        });
        setToken(result.access_token);
        setUserInfo({
          id: result.id,
          role: result.role,
          student_no: result.student_no,
          name: result.name,
        });
        window.location.href = '/student';
      } catch (error) {
        showLoginError('student-error', error.message || '登录失败，请检查学号和密码');
      }
    });

    // 切换Tab时清除错误提示
    document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(tab => {
      tab.addEventListener('shown.bs.tab', () => {
        hideLoginError('admin-error');
        hideLoginError('student-error');
      });
    });
  });
</script>
{% endblock %}
