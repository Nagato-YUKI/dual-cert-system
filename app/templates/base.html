<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}证书管理系统{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Alert Container -->
  <div id="alert-container" class="alert-container"></div>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">证书管理系统</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <!-- Admin Navigation -->
          <li class="nav-item admin-nav" style="display: none;">
            <a class="nav-link" href="/admin">管理仪表盘</a>
          </li>
          <li class="nav-item admin-nav" style="display: none;">
            <a class="nav-link" href="/admin/certificates">证书管理</a>
          </li>
          <li class="nav-item admin-nav" style="display: none;">
            <a class="nav-link" href="/admin/exams">考试管理</a>
          </li>
          <li class="nav-item admin-nav" style="display: none;">
            <a class="nav-link" href="/admin/reviews">审核中心</a>
          </li>
          <!-- Student Navigation -->
          <li class="nav-item student-nav" style="display: none;">
            <a class="nav-link" href="/student">我的仪表盘</a>
          </li>
          <li class="nav-item student-nav" style="display: none;">
            <a class="nav-link" href="/student/certificates">证书浏览</a>
          </li>
          <li class="nav-item student-nav" style="display: none;">
            <a class="nav-link" href="/student/exams">考试报名</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <span id="user-name">访客</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" href="#" id="logout-btn" style="display: none;">退出登录</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-light text-center py-3 mt-auto">
    <div class="container">
      <span class="text-muted">证书管理系统 &copy; 2025</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
