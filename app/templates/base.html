<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}证书管理系统{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- Alert Container -->
  <div id="alert-container" class="alert-container position-fixed top-0 end-0 p-3" style="z-index: 1050;"></div>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/" style="color: var(--primary);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2" style="vertical-align: text-bottom;">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/>
        </svg>
        证书管理系统
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <!-- Admin Navigation -->
          <li class="nav-item admin-nav" style="display: none;">
            <a class="nav-link" href="/admin">仪表盘</a>
          </li>
          <li class="nav-item admin-nav" style="display: none;">
            <a class="nav-link" href="/admin/certificates">证书</a>
          </li>
          <li class="nav-item admin-nav" style="display: none;">
            <a class="nav-link" href="/admin/exams">考试</a>
          </li>
          <li class="nav-item admin-nav" style="display: none;">
            <a class="nav-link" href="/admin/reviews">审核</a>
          </li>
          <li class="nav-item admin-nav" style="display: none;">
            <a class="nav-link" href="/admin/bigscreen">数据大屏</a>
          </li>
          <!-- Student Navigation -->
          <li class="nav-item student-nav" style="display: none;">
            <a class="nav-link" href="/student">我的</a>
          </li>
          <li class="nav-item student-nav" style="display: none;">
            <a class="nav-link" href="/student/certificates">证书</a>
          </li>
          <li class="nav-item student-nav" style="display: none;">
            <a class="nav-link" href="/student/exams">报名</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="avatar-circle me-2" style="width: 28px; height: 28px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">
                <span id="user-avatar">U</span>
              </span>
              <span id="user-name">访客</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-lg" aria-labelledby="userDropdown" style="border: 1px solid var(--border); border-radius: var(--radius-lg);">
              <li><a class="dropdown-item" href="#" id="logout-btn" style="display: none; color: var(--error);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: text-bottom; margin-right: 6px;">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                退出登录
              </a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow-1 py-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center py-3" style="background: var(--card); border-top: 1px solid var(--border);">
    <div class="container">
      <span style="color: var(--text-tertiary); font-size: 13px;">证书管理系统 &copy; 2025</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
